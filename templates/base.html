{% macro icon(name) -%}
    <svg class="icon"
         width="20"
         height="20"
         viewBox="0 0 24 24"
         fill="none"
         stroke="currentColor"
         stroke-width="1.6"
         stroke-linecap="round"
         stroke-linejoin="round"
         aria-hidden="true">
        {% if name == 'plus' %}
            <path d="M12 5v14M5 12h14" />
        {% elif name == 'arrow' %}
            <path d="M5 12h14M13 6l6 6-6 6" />
        {% elif name == 'download' %}
            <path d="M12 3v12m-5-5 5 5 5-5M5 16v5h14v-5" />
        {% elif name == 'search' %}
            <circle cx="10.5" cy="10.5" r="6.5" />
            <path d="m16 16 5 5" />
        {% elif name == 'close' %}
            <path d="m6 6 12 12M6 18 18 6" />
        {% elif name == 'grid' %}
            <rect x="4" y="4" width="6" height="6" /><rect x="14" y="4" width="6" height="6" /><rect x="4" y="14" width="6" height="6" /><rect x="14" y="14" width="6" height="6" />
        {% elif name == 'sort' %}
            <path d="M8 4v16m-4-4 4 4 4-4M16 20V4m-4 4 4-4 4 4" />
        {% endif %}
    </svg>
{%- endmacro %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="icon"
              type="image/svg+xml"
              href="{{ url_for('static', filename='favicon.svg') }}">
        <meta name="theme-color" content="#002FA7">
        <title>
            {% block title %}Job Tracker{% endblock %}
        </title>
        <link rel="stylesheet"
              href="{{ url_for('static', filename='styles.css') }}">
        <script src="{{ url_for('static', filename='shared.js') }}" defer></script>
        {% block head %}{% endblock %}
    </head>
    <body class="{% block body_class %}{% endblock %}">
        <a class="skip-link" href="#main">Skip to content</a>
        {% block body %}{% endblock %}
        <div id="messageContainer"
             class="message-container"
             role="status"
             aria-live="polite"></div>
    </body>
</html>
